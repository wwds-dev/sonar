[project]
name = "sonar"
version = "0.1.0"
description = "SONAR — a live, honest BTC hourly up/down paper-trading terminal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []          # stdlib only — no pip install needed

[project.scripts]
sonar = "sonar.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sonar"]

[tool.pytest.ini_options]
# Abort a test that has been running for a minute and print every thread's
# stack. The whole suite takes about fifteen seconds, so anything near this is
# wedged, not slow — and a Qt thread that deadlocks the interpreter cannot be
# interrupted from Python, so a hard abort with a traceback is the only way out.
# One run here sat blocked for 5h50m before anyone noticed; see tests/conftest.py.
#
# This is pytest's own faulthandler plugin rather than a call in conftest.
# Calling faulthandler.dump_traceback_later() directly does not survive: the
# plugin cancels any pending dump in pytest_exception_interact and around each
# test, so a session-wide timer set in pytest_configure is silently disarmed.
faulthandler_timeout = 60
faulthandler_exit_on_timeout = true

# Tests that genuinely need the internet are opt-in: run them with
# `pytest -m network`. They are real checks — they confirm ESPN still serves
# every league in the registry — but a suite that reaches the network is a
# suite that fails when someone else rate-limits you, and one that varies from
# 3 to 16 seconds depending on their latency. Both were happening here.
#
# Tests marked `slow` are the full Monte-Carlo checks of a statistical design
# (V-12 of docs/specs/shadow-time-stop.md: 20,000 books). A cheaper version of
# each always runs; the full one runs at release and on any change to the gate
# code, with `./run-tests.sh tests/ -m slow`.
#
# Tests marked `rate` are the backtest's randomisation rate tests
# (docs/specs/sign-randomisation-verdicts.md [A4]). They run by default and in
# CI, each under the 60 s cap; they are marked so that coverage can run them in
# a pass of their own with that cap lifted (TESTING.md §7).
addopts = "-m 'not network and not slow'"
markers = [
    "network: test genuinely needs a live network connection (deselected by default)",
    "slow: full Monte-Carlo check, minutes not seconds (deselected by default; -m slow)",
    "rate: a backtest rate test of many replays, each under the 60 s cap (runs by default; coverage runs them in their own pass, -m rate)",
]
