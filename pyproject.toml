[project]
name = "sonar"
version = "0.1.0"
description = "SONAR — a live, honest BTC hourly up/down paper-trading terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []          # stdlib only — no pip install needed

[project.scripts]
sonar = "sonar.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sonar"]
